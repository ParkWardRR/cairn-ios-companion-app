name: CairnCompanion
options:
  bundleIdPrefix: app.cairn
  deploymentTarget:
    iOS: "18.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  CairnCompanionKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: $(CAIRN_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
targets:
  CairnCompanion:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: CairnCompanionKit
        product: CairnRuntime
    entitlements:
      path: App/CairnCompanion.entitlements
      properties:
        # Lets the app use the dashboard's passkeys (the same ones Safari uses). The domain is yours:
        # set CAIRN_PASSKEY_DOMAIN in Config/Local.xcconfig; it is never committed. Nothing reads it
        # before R5 (decision D9), but the App ID carries the capability and dropping it from the
        # entitlements would mean asking Apple for it back.
        com.apple.developer.associated-domains:
          - webcredentials:$(CAIRN_PASSKEY_DOMAIN)
        # Needs "CarPlay Driving Task App" enabled on the App ID and a provisioning profile that
        # carries it, or signing fails. Apple approved this App ID on 2026-10-08. The CarPlay
        # scene itself returns in R5, so no scene delegate is declared below yet.
        com.apple.developer.carplay-driving-task: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAIRN_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        # Per-repository semver, pre-1.0 until a stranger can install Cairn without a toolchain
        # (front door Phase 32). 0.2.0 is the rewrite; 0.1.x was the app at tag legacy-v1.
        MARKETING_VERSION: "0.2.0"
        # Deliberately 0, and deliberately never edited: the build number is
        # `git rev-list --count HEAD`, passed in by scripts/release-testflight.sh. A number typed
        # here goes stale the moment someone forgets, and this project has already carried 12 in
        # project.yml while the pbxproj said 13. A 0 on an uploaded build means the script was
        # bypassed, which App Store Connect rejects on the second upload.
        CURRENT_PROJECT_VERSION: "0"
        # Which release channel this build belongs to: dev, beta or stable. The defaults here are
        # the honest ones for a build made by hand; the release script passes the real values.
        # See the front door's docs/release-process.md.
        CAIRN_CHANNEL: dev
        CAIRN_COMMIT: unknown
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cairn
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Cairn connects to your Cairn dongle over Bluetooth to prime its GPS receiver and collect finished drives.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Cairn sends your phone's position to the dongle so its receiver finds the sky faster.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Cairn keeps sending your phone's position to the dongle while you drive, with the screen off.
    scheme:
      testTargets:
        - CairnCompanionUITests
    info:
      path: App/Info.plist
      properties:
        # Both version keys are references, never literals. xcodegen writes a literal "1.0" and
        # "1" into a generated plist if you let it, and a literal in the plist beats the build
        # setting -- which is how an app can archive as 1.0 (1) while project.yml says otherwise.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # So a build can say what it is: Settings reads these back, and a tester reporting
        # something gives a channel and a commit rather than "the latest one".
        CairnChannel: $(CAIRN_CHANNEL)
        CairnCommit: $(CAIRN_COMMIT)
        UIBackgroundModes: [location, bluetooth-central]
        # Goes away in R3, when the pinned CA becomes a trust anchor in the URLSession delegate,
        # which ATS permits on its own.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: app.cairn.companion.configure
            CFBundleURLSchemes: [cairn]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  # Drives the real app in the simulator. The unit suites (CairnProtocolTests, CairnKitTests)
  # cover every decision; nothing but this notices a view that crashes on appear or a screen with
  # no way out.
  CairnCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CairnCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAIRN_BUNDLE_ID).uitests
        TEST_TARGET_NAME: CairnCompanion
        GENERATE_INFOPLIST_FILE: YES
